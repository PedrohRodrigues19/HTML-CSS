<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios</title>
</head>
<body>
    <h1>Reproduzindo Audios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="musica/happy-mistake.mp3" controls></audio> 
    <!-- MP3 WAV OGG -->
     <h1>Reproduzindo Vídeos hospedados localmente</h1>
     <p>Este video esta hospedado no meu proprio servidor</p>
     <video width="600" poster="imagens/RobloxScreenShot20250906_202853299.png" controls>
        <source src="videos/Meuvideo.mp4" type="video/mp4">
        <source src="videos/Meuvideo-web.webm" type="video/webm">
        <source src="videos/Meuvideo-ogg.ogg" type="video/ogg">
        <p>Seu navegador não suporta o elemento de vídeo.</p>
     </video>
     <h1>Inserindo videos do YouTube</h1>
     <iframe width="600" height="315" src="https://www.youtube.com/embed/c2GX-2zNvJ8?si=LzcSJ9FLSCOUWN_K" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
     <!-- Ir em um video do youtube e clicar em Compartilhar -> Incorporar -->
      <h1>Inserindo videos do Vimeo</h1>
