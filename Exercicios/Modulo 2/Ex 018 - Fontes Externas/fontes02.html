<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Archivo Black';
            src: url(ArchivoBlack-Regular.ttf); format('opentype'); url (ArchivoBlack-Regular.ttf) format('truetype');

            font-weight:normal;
            font-style:normal;
            /* Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype (eot)
            - true-type-att (Apple Advanced Typography)
            - svg (svg)
            */
        }
        body {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            color: black;
        }

        h1 {
            font-family:'Times New Roman', Times, serif;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <h1>Fontes externas</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Cum doloribus ex amet vitae dignissimos id consectetur repudiandae quis dolores et ab culpa deleniti officia molestias quos perspiciatis dolor, illo repellendus?</p> 
</body>
</html>
