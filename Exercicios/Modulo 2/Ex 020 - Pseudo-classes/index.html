<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo-classes</title>
    <style>
        div{
            background-color: #d36868;
            border: 1px solid #000; 
            text-align: center;
            height: 200px;
            width: 200px;
            display: inline-block;
        }

        div:hover{
            background-color: #68d3a4;
        }
    </style>
</head>
<body>
    <div>
        <div id="box1">01</div>
        <div id="box2">02</div>
        <div id="box3">03</div>
    </div>
    
</body>
</html>
