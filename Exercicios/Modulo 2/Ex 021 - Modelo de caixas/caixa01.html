<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixa</title>
    <style>
        h1  /* box-level*/{
            background-color: #f2f2f2;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: #ccc;

border: 10px solid darkblue;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

padding: 10px; /* se todas as especificações forem iguais basta apenas colocar a medida uma vez */

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

margin: 20px 20px 40px 20px;


            outline-width: 10px;
            outline-style: dashed;
            outline-color: rgb(176, 179, 39);

outline: 10px dashed rgb(176, 179, 39)

            
        }
        a /* inline-level*/{
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
   <h1>Exemplos de Caixa Box-Level</h1> 
   <p>Parágrafos tambem são um exemplo de box-level, mas os <a href="#">links</a> são elementos inline.Vamos ver como tudo isso funciona.</p>
</body>
</html>
